<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Story Bot</title>
  <style>
    /* Background */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Chat container */
    .chat-container {
      width: 600px;          
      max-width: 95%;
      background: #fff;
      padding: 0;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.6s ease-in-out;
      max-height: 90vh;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Heading bar */
    .chat-header {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Chat messages area */
    #chat-box {
      flex: 1;
      border: none;
      padding: 15px;
      margin: 0;
      border-radius: 0;
      overflow-y: auto;
      height: 500px; 
      background: #f9f9fb;
    }

    /* Chat bubbles */
    .message {
      padding: 12px 18px;
      margin: 10px 0;
      border-radius: 18px;
      max-width: 75%;
      word-wrap: break-word;
      animation: slideIn 0.3s ease-in-out;
      font-size: 15px;
      line-height: 1.4;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      background: #4f9dff;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .bot {
      background: #4CAF50;
      color: white;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    /* Input area */
    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #fff;
      border-top: 1px solid #eee;
    }

    #message {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    #message:focus {
      border-color: #4f9dff;
      box-shadow: 0 0 5px rgba(79,157,255,0.6);
    }

    button {
      padding: 12px 20px;
      border: none;
      background: linear-gradient(135deg, #4f9dff, #0061ff);
      color: white;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    button:hover {
      background: linear-gradient(135deg, #0061ff, #0040c9);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- Heading -->
    <div class="chat-header"> STORY BOT</div>

    <!-- Chat box -->
    <div id="chat-box"></div>

    <!-- Input area -->
    <div class="input-area">
      <input type="text" id="message" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()"/>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("message");
      const chatBox = document.getElementById("chat-box");

      const userMessage = input.value.trim();
      if (!userMessage) return;

      // Display user message
      const userDiv = document.createElement("div");
      userDiv.className = "message user";
      userDiv.innerHTML = userMessage;
      chatBox.appendChild(userDiv);

      input.value = "";

      // Scroll down
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // Call backend
        const response = await fetch("http://127.0.0.1:8000/generate", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: userMessage})
        });
        const data = await response.json();

        // Display bot response
        const botDiv = document.createElement("div");
        botDiv.className = "message bot";
        botDiv.innerHTML = data.response;
        chatBox.appendChild(botDiv);

        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "message bot";
        errorDiv.innerHTML = "⚠️ Backend error. Please check server.";
        chatBox.appendChild(errorDiv);
      }
    }
  </script>
</body>
</html>
